name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          choco install ffmpeg -y --no-progress
      - name: Generar icono
        run: python make_icon.py
      - name: Probar motor de exportación
        run: python test_engine.py
      - name: Compilar
        shell: pwsh
        run: ./build_windows.ps1
      - name: Reemplazar FFmpeg por la versión real
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          $bin = (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" dist/NoiseCutStudio/ffmpeg -Force
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/NoiseCutStudio -DestinationPath NoiseCutStudio-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NoiseCutStudio-Windows
          path: NoiseCutStudio-Windows.zip
